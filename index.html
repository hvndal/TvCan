<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tvcan - VLC Media Player</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- VLC App Header -->
    <header class="app-header">
      <div class="brand">
        <!-- VLC Traffic Cone SVG Logo -->
        <div class="vlc-cone-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L8.5 10H15.5L12 2Z"/>
            <path d="M7.5 12L6 16H18L16.5 12H7.5Z"/>
            <path d="M5 18L3 22H21L19 18H5Z"/>
          </svg>
        </div>
        <div style="display: flex; align-items: baseline;">
          <span class="brand-title">tvcan</span>
          <span class="brand-subtitle">vlc player • made by herman</span>
        </div>
      </div>

      <div class="header-actions">
        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="searchInput" placeholder="Search live channels...">
        </div>

        <button class="btn" id="btnRefresh" title="Refresh Streams">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          Refresh
        </button>

        <button class="btn btn-primary" id="btnSettings" title="Stream Source Settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Source
        </button>
      </div>
    </header>

    <!-- Main Content Body -->
    <div class="app-body">
      <!-- Sidebar Categories -->
      <aside class="sidebar">
        <div class="sidebar-header">Main Categories</div>
        <div class="sidebar-menu" id="categoryMenu">
          <div class="menu-item active" data-category="ALL">
            <span>📺 All Working Channels</span>
            <span class="menu-badge" id="badgeAllCount">0</span>
          </div>
          <div class="menu-item" data-category="FAVORITES">
            <span>⭐ Favorites</span>
            <span class="menu-badge" id="badgeFavCount">0</span>
          </div>
          <div id="categoryList"></div>
        </div>
      </aside>

      <!-- Main Player & Channels Section -->
      <main class="main-content">
        <!-- Video Player Theater -->
        <section class="player-container">
          <div class="video-wrapper">
            <video id="videoPlayer" playsinline></video>
            <iframe id="iframePlayer" class="hidden" allowfullscreen allow="autoplay"></iframe>

            <div class="player-overlay" id="playerOverlay">
              <div class="spinner" id="playerSpinner"></div>
              <div class="overlay-title" id="overlayTitle">Select a channel to play</div>
              <div class="overlay-sub" id="overlaySub">tvcan • VLC Media Player Engine</div>
            </div>
          </div>

          <!-- VLC Classic Transport Controls Bar -->
          <div class="vlc-transport-bar">
            <div class="transport-left">
              <button class="vlc-btn" id="btnPrevChannel" title="Previous Channel">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
              </button>

              <button class="vlc-btn play-btn" id="btnPlayPause" title="Play / Pause">
                <svg id="iconPlay" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg id="iconPause" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
              </button>

              <button class="vlc-btn" id="btnStop" title="Stop Stream">
                <rect x="6" y="6" width="12" height="12" fill="currentColor"></rect>
              </button>

              <button class="vlc-btn" id="btnNextChannel" title="Next Channel">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
              </button>

              <div class="playing-info">
                <img id="playingLogo" class="playing-logo" src="" alt="" style="display: none;">
                <div class="playing-details">
                  <span class="playing-title" id="playingTitle">No Channel Selected</span>
                  <span class="playing-meta" id="playingMeta">
                    <span id="playingStatus">Ready</span>
                  </span>
                </div>
              </div>
            </div>

            <div class="transport-right">
              <div class="volume-container">
                <button class="vlc-btn" id="btnMute" style="width: 24px; height: 24px; border: none; background: none;" title="Mute/Unmute">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </button>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                <span class="volume-text" id="volumeText">100%</span>
              </div>

              <button class="vlc-btn" id="btnPip" title="Picture in Picture">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><rect x="12" y="9" width="8" height="6" rx="1" ry="1"></rect></svg>
              </button>

              <button class="vlc-btn" id="btnFullscreen" title="Fullscreen">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
              </button>
            </div>
          </div>
        </section>

        <!-- Channels Grid Section -->
        <section class="channels-section">
          <div class="channels-header">
            <div class="channels-title">
              <span id="currentCategoryTitle">All Working Channels</span>
              <span class="menu-badge" id="currentCategoryCount">0</span>
            </div>
            <div class="working-indicator">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="#10b981"><circle cx="12" cy="12" r="10"></circle></svg>
              <span>Direct Working Streams</span>
            </div>
          </div>

          <div class="channels-grid" id="channelsGrid">
            <!-- Rendered Channel Cards -->
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">Stream Source Settings</span>
        <button class="vlc-btn" id="btnCloseModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="playlistUrlInput">M3U / M3U8 Playlist URL</label>
          <input type="text" class="form-input" id="playlistUrlInput" value="https://iptv-org.github.io/iptv/index.m3u">
        </div>
        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px;">
          <button class="btn" id="btnResetUrl">Default URL</button>
          <button class="btn btn-primary" id="btnSaveUrl">Load Playlist</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
